<?xml version="1.0" encoding="UTF-8"?>
<svg width="110" height="110" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
  <rect width="110" height="110" fill="#0c111c"/>
  <!-- Crown of Three: parent mark for the Inferno Lab brand -->
  <!-- Left peak -->
  <path d="M16,88 L34,42 L52,88" fill="none" stroke="#f07030" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" opacity="0.65"/>
  <!-- Center peak -->
  <path d="M38,88 L55,14 L72,88" fill="none" stroke="#f07030" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Right peak -->
  <path d="M58,88 L76,42 L94,88" fill="none" stroke="#f07030" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" opacity="0.65"/>
  <!-- Base bar -->
  <line x1="12" y1="92" x2="98" y2="92" stroke="#f07030" stroke-width="3" opacity="0.4"/>
  <!-- Corner brackets -->
  <g stroke="#6d85a0" stroke-width="1.5" fill="none" opacity="0.3">
    <polyline points="8,20 8,8 20,8"/>
    <polyline points="90,8 102,8 102,20"/>
    <polyline points="102,90 102,102 90,102"/>
    <polyline points="20,102 8,102 8,90"/>
  </g>
</svg>
